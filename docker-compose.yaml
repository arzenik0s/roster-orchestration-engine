services:
  ollama:
    image: ollama/ollama:${OLLAMA_VERSION:-latest}
    ports:
      - "11434:11434"
    volumes:
      - ollama:/root/.ollama
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:11434/api/tags"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s
    # Uncomment for NVIDIA GPU acceleration:
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: all
    #           capabilities: [gpu]

  agent:
    build:
      context: .
      dockerfile: Dockerfile
    depends_on:
      ollama:
        condition: service_healthy
    environment:
      ConnectionStrings__Db: /data/roster.db
      Ollama__Url: http://ollama:11434
      Ollama__Model: ${OLLAMA_MODEL:-llama3.2:3b}
      Roster__Interval: ${ROSTER_INTERVAL:-00:02:00}
      Roster__WindowDays: ${ROSTER_WINDOW_DAYS:-3}
    volumes:
      - ./data:/data
    restart: unless-stopped

volumes:
  ollama:
